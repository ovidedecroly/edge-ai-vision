version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: edge_vision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: edge_user
      POSTGRES_PASSWORD: edge_password_secure
      POSTGRES_DB: edge_vision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_user -d edge_vision"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. go2rtc WebRTC Gateway
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: edge_vision_go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984" # API and Web UI
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp"
    network_mode: host # Host mode required for low-latency WebRTC and camera UDP stream discovery

  # 3. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edge_vision_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://edge_user:edge_password_secure@postgres:5432/edge_vision
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  # 4. Vue 3 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edge_vision_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  # 5. Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: edge_vision_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
